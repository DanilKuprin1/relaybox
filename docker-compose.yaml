# compose.yaml
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relaybox
      POSTGRES_PASSWORD: relaybox
      POSTGRES_DB: relaybox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaybox -d relaybox"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: